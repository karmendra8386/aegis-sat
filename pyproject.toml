[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-sat"
version = "0.0.1"
description = "Policy-gated AI agent framework for safe onboard satellite fault response"
requires-python = ">=3.10"
dependencies = ["pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]
